services:
  db:
    image: postgres:16
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data/
    env_file:
      - .env
    networks:
    - proxy-network

  app:
    build:
      context: .
    env_file:
      - .env
    networks:
      - proxy-network
    depends_on:
      - db
    restart: always

networks:
  proxy-network:

volumes:
  db_data:
